cat << 'EOF' > /Users/jayu/ai-router/index_1.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic AI Router</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h2 { margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; background: #1e293b; padding: 10px 14px; border-radius: 8px; flex-wrap: wrap; }
    .user-box { display: flex; align-items: center; gap: 8px; }
    .user-box label { font-size: 13px; color: #94a3b8; font-weight: bold; }
    .user-box input { width: 130px; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-size: 14px; }
    .status-pill { font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 999px; }
    .status-live { background: #064e3b; color: #34d399; border: 1px solid #10b981; }
    .status-killed { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
    #chat { background: #1e293b; border-radius: 10px; padding: 16px; height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #3b82f6; align-self: flex-end; }
    .bot { background: #334155; align-self: flex-start; }
    .killed { background: #7f1d1d; border: 1px solid #ef4444; }
    .badge { font-size: 11px; font-weight: bold; color: #38bdf8; margin-bottom: 4px; display: block; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #1e293b; color: white; font-size: 15px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🚀 Dynamic AI Router & Kill Switch</h2>
  <div class="sub">Controlled live by local Flagsmith (localhost:8000)</div>

  <div class="top-bar">
    <div class="user-box">
      <label for="uid">User ID:</label>
      <input id="uid" value="user_1" oninput="checkStatus()" />
    </div>
    <div id="status-pill" class="status-pill status-live">● Checking...</div>
  </div>

  <div id="chat"></div>
  <div class="row">
    <input id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()" />
    <button onclick="send()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("msg");
    const uidInput = document.getElementById("uid");
    const statusPill = document.getElementById("status-pill");

    async function checkStatus() {
      const userId = uidInput.value.trim() || "guest";
      try {
        const res = await fetch(`/status?user_id=${encodeURIComponent(userId)}`);
        const data = await res.json();
        if (data.killed) {
          statusPill.className = "status-pill status-killed";
          statusPill.textContent = "🚨 KILL SWITCH ON";
        } else {
          statusPill.className = "status-pill status-live";
          statusPill.textContent = `● LIVE • ${data.model}`;
        }
      } catch {
        statusPill.className = "status-pill status-killed";
        statusPill.textContent = "⚠️ SERVER OFFLINE";
      }
    }

    function addMsg(text, cls, badge = "") {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.innerHTML = (badge ? `<span class="badge">${badge}</span>` : "") + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      const userId = uidInput.value.trim() || "guest";
      if (!text) return;
      addMsg(text, "user", `User: ${userId}`);
      input.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, user_id: userId })
      });
      const data = await res.json();
      const badge = data.latency_ms ? `${data.model} • ${data.latency_ms}ms` : data.model;
      addMsg(data.reply, data.killed ? "bot killed" : "bot", badge);
    }

    checkStatus();
    setInterval(checkStatus, 3000);
  </script>
</body>
</html>
